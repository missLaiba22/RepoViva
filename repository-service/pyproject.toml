[project]
name = "repository-service"
version = "0.1.0"
description = "RepoViva Repository Service: repository ingestion and retrieval"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Data validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Outbound HTTP (callbacks to Core API)
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    "cocoindex>=0.3.0",             # NEW
    "python-dotenv>=1.0.0",
    "litellm>=1.101.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "httpx>=0.27.0",              # for FastAPI's TestClient
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"              # NEW — no need for @pytest.mark.asyncio
markers = [                        # NEW
    "integration: hits real external services (network, GitHub, etc.)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repository_service"]
