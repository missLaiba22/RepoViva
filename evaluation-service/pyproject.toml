[project]
name = "evaluation-service"
version = "0.1.0"
description = "RepoViva Evaluation Service: grades a finished interview and writes its report"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # Data validation & settings; pydantic also validates the grader's JSON (decision 050)
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # Outbound HTTP (Voice Service, Repository Service)
    "httpx>=0.28.1",
    "asyncpg>=0.30.0",
    # LLM calls — model is a config value (decision 051)
    "litellm>=1.101.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evaluation_service"]
