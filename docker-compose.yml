services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repoviva-postgres
    environment:
      POSTGRES_USER: repoviva
      POSTGRES_PASSWORD: repoviva_dev
      POSTGRES_DB: repoviva
    ports:
      - "5432:5432"
    volumes:
      - repoviva_pg_data:/var/lib/postgresql/data

  # Voice Service's interview sessions (decision 053). No auth: local only.
  mongodb:
    image: mongo:8.0
    container_name: repoviva-mongodb
    ports:
      - "27017:27017"
    volumes:
      - repoviva_mongo_data:/data/db

  # SQS locally (decision 057); same code path as AWS, only AWS_ENDPOINT_URL differs.
  localstack:
    image: localstack/localstack:4.9
    container_name: repoviva-localstack
    environment:
      SERVICES: sqs
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh

volumes:
  repoviva_pg_data:
  repoviva_mongo_data:
