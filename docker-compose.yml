services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: repoviva-postgres
    environment:
      POSTGRES_USER: repoviva
      POSTGRES_PASSWORD: repoviva_dev
      POSTGRES_DB: repoviva
    ports:
      - "5432:5432"
    volumes:
      - repoviva_pg_data:/var/lib/postgresql/data

  # Voice Service's interview sessions (decision 053). No auth: local only.
  mongodb:
    image: mongo:8.0
    container_name: repoviva-mongodb
    ports:
      - "27017:27017"
    volumes:
      - repoviva_mongo_data:/data/db

volumes:
  repoviva_pg_data:
  repoviva_mongo_data:
